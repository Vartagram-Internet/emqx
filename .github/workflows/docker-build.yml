name: 🐳 Build and Push Docker Image

on:
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - 'apps/emqx_delivery_timeout/**'
      - 'deploy/docker/**'
      - 'mix.exs'
      - 'Makefile'
      - 'docker-compose.yml'
      - '.github/workflows/build-docker.yml'
    tags:
      - 'v*'
      - 'release-*'
  
  pull_request:
    branches:
      - main
      - master
  
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push image to registry'
        required: false
        default: 'false'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        profile: [emqx, emqx-enterprise]

    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest
          buildkitd-flags: --debug

      - name: 📝 Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,suffix=-${{ matrix.profile }}
            type=semver,pattern={{version}},suffix=-${{ matrix.profile }}
            type=semver,pattern={{major}}.{{minor}},suffix=-${{ matrix.profile }}
            type=sha,suffix=-${{ matrix.profile }}
            type=raw,value=latest,enable={{is_default_branch}},suffix=-${{ matrix.profile }}
            type=raw,value=delivery-timeout-${{ matrix.profile }}
          labels: |
            org.opencontainers.image.title=EMQX with delivery.timeout
            org.opencontainers.image.description=EMQX broker with delivery timeout tracking feature
            org.opencontainers.image.vendor=EMQX
            org.opencontainers.image.profile=${{ matrix.profile }}

      - name: 🔐 Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/docker/Dockerfile
          
          # Only push on:
          # 1. Merged PRs to main/master
          # 2. Releases (tags)
          # 3. Manual workflow_dispatch with push_image=true
          push: |
            ${{
              github.event_name != 'pull_request' &&
              (
                github.ref_type == 'tag' ||
                github.ref_name == 'main' ||
                github.ref_name == 'master' ||
                (github.event_name == 'workflow_dispatch' && github.event.inputs.push_image == 'true')
              )
            }}
          
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          
          build-args: |
            PROFILE=${{ matrix.profile }}
            BUILD_FROM=ghcr.io/emqx/emqx-builder/6.0-9:1.19.1-28.2-2-debian13
            RUN_FROM=debian:13-slim
          
          # Support multiple architectures
          platforms: linux/amd64,linux/arm64

      - name: 📊 Image digest
        run: |
          echo "## 🐳 Docker Image Built" >> $GITHUB_STEP_SUMMARY
          echo "**Profile:** ${{ matrix.profile }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:** ${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "**Platforms:** linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY

  test:
    name: Test Docker Image
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build test image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/docker/Dockerfile
          load: true
          tags: emqx:test
          build-args: |
            PROFILE=emqx

      - name: 🧪 Test image
        run: |
          docker run --rm emqx:test emqx eval "emqx_delivery_timeout:get_stats()."

      - name: ✅ Verify delivery.timeout module
        run: |
          docker run --rm emqx:test emqx eval "code:which(emqx_delivery_timeout)."

  release:
    name: Create Release Notes
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v4

      - name: 📝 Extract release notes
        id: release
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "## Release $VERSION" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "**Features:**" >> RELEASE_NOTES.md
          echo "- ✅ EMQX Broker with delivery.timeout event" >> RELEASE_NOTES.md
          echo "- ✅ Timeout tracking for queued messages" >> RELEASE_NOTES.md
          echo "- ✅ Rule engine integration" >> RELEASE_NOTES.md
          echo "- ✅ Dashboard event visibility" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "**Docker Images:**" >> RELEASE_NOTES.md
          echo "- \`ghcr.io/${{ github.repository }}:$VERSION-emqx\`" >> RELEASE_NOTES.md
          echo "- \`ghcr.io/${{ github.repository }}:$VERSION-emqx-enterprise\`" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "**Pull:**" >> RELEASE_NOTES.md
          echo "\`\`\`bash" >> RELEASE_NOTES.md
          echo "docker pull ghcr.io/${{ github.repository }}:$VERSION" >> RELEASE_NOTES.md
          echo "\`\`\`" >> RELEASE_NOTES.md

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Notify Build Status
    needs: [build, test]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: 📢 Build Status Summary
        run: |
          echo "## 🐳 Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** ${{ env.REGISTRY }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Features:**" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Multi-architecture support (amd64, arm64)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Automatic release tagging" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Image testing in CI/CD" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Release notes generation" >> $GITHUB_STEP_SUMMARY
